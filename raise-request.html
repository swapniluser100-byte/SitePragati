<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Raise a Request — SitePragati</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="images/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>form[hidden]{display:none;}</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="/" class="brand"><img src="images/logo-horizontal-color.png" alt="SitePragati" class="brand-logo"></a>
  </nav>
</header>

<main id="main">
  <section>
    <div class="wrap" style="max-width:600px;">
      <h2>Raise a request</h2>
      <p class="section-lead">Tell us what you need and we'll get back to you.</p>

      <p id="loadingNote" class="form-note" hidden>Loading your account…</p>

      <div class="mode-toggle" id="modeToggle" hidden>
        <button type="button" class="mode-toggle-btn active" data-mode="raise">Raise a request</button>
        <button type="button" class="mode-toggle-btn" data-mode="track">Track a request</button>
      </div>

      <form id="trackForm" hidden>
        <label for="trackTicketId">Request ID</label>
        <input type="text" id="trackTicketId" inputmode="numeric" placeholder="e.g. 42 — from your confirmation" required>
        <p id="trackError" class="form-note" style="color:#B3261E;" hidden></p>
        <button type="submit" class="btn btn-primary" id="trackBtn">Check status</button>
      </form>

      <div id="trackResult" class="track-result" hidden></div>

      <form id="lookupForm" hidden>
        <label for="lookupCustomerId">Your Customer ID</label>
        <input type="text" id="lookupCustomerId" placeholder="Paste the customer ID from your welcome email" required>
        <p id="lookupError" class="form-note" style="color:#B3261E;" hidden></p>
        <button type="submit" class="btn btn-primary" id="lookupBtn">Continue</button>
      </form>

      <form id="requestForm" hidden>
        <label for="customerDisplay">Customer</label>
        <input type="text" id="customerDisplay" readonly disabled>

        <label for="reqSubject">What's this about?</label>
        <input type="text" id="reqSubject" placeholder="e.g. Update menu prices, Fix broken image" required>

        <label for="reqDescription">Details</label>
        <textarea id="reqDescription" rows="5" placeholder="Describe what you need — the more detail, the faster we can help." required></textarea>

        <label for="reqFile">Attach a file (optional, 10MB max)</label>
        <input type="file" id="reqFile">

        <button type="submit" class="btn btn-primary" id="reqSubmitBtn">Submit request</button>
        <p class="form-note" id="reqStatusNote"></p>
      </form>

      <p id="successNote" class="form-note" hidden></p>
    </div>
  </section>
</main>

<script src="raise-request.js"></script>
</body>
</html>
