<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SitePragati — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login screen -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>SitePragati</h1>
    <p class="login-sub">Admin console</p>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Enter admin password" required autofocus>
    <button type="submit" class="btn btn-primary">Log in</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<!-- Dashboard (hidden until authenticated) -->
<div id="dashboard" class="dashboard" hidden>
  <header class="admin-header">
    <span class="brand">SitePragati <span>Admin</span></span>
    <button type="button" id="logoutBtn" class="btn btn-outline btn-small">Log out</button>
  </header>

  <nav class="admin-tabs">
    <button type="button" class="tab-btn active" data-tab="leads">Leads</button>
    <button type="button" class="tab-btn" data-tab="caseStudies">Case Studies</button>
  </nav>

  <!-- Leads tab -->
  <section id="leadsTab" class="tab-panel active">
    <div class="panel-head">
      <h2>Leads</h2>
      <button type="button" id="refreshLeads" class="btn btn-outline btn-small">Refresh</button>
    </div>
    <div class="table-wrap">
      <table id="leadsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Business</th>
            <th>Type</th>
            <th>Contact</th>
            <th>Message</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr><td colspan="8" class="empty-note">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Case Studies tab -->
  <section id="caseStudiesTab" class="tab-panel">
    <div class="panel-head">
      <h2>Case Studies</h2>
      <button type="button" id="addCaseStudyBtn" class="btn btn-primary btn-small">+ Add case study</button>
    </div>

    <div id="caseStudyForm" class="cs-form" hidden>
      <h3 id="csFormTitle">Add case study</h3>
      <input type="hidden" id="csId">
      <div class="cs-form-grid">
        <div>
          <label for="csBusinessName">Business name</label>
          <input type="text" id="csBusinessName" required>
        </div>
        <div>
          <label for="csCategory">Category</label>
          <input type="text" id="csCategory" placeholder="e.g. Café & restaurant">
        </div>
        <div>
          <label for="csSiteUrl">Site URL</label>
          <input type="text" id="csSiteUrl" placeholder="example.pages.dev">
        </div>
        <div>
          <label for="csImageFile">Image filename</label>
          <input type="text" id="csImageFile" placeholder="case-placeholder.svg">
        </div>
        <div>
          <label for="csSortOrder">Sort order</label>
          <input type="number" id="csSortOrder" value="0">
        </div>
      </div>
      <label for="csDescription">Description</label>
      <textarea id="csDescription" rows="3"></textarea>

      <p class="cs-stats-label">Stats (up to 3, label + value each — leave blank to omit)</p>
      <div class="cs-form-grid cs-stats-grid">
        <input type="text" id="csStat1Label" placeholder="Stat 1 label">
        <input type="text" id="csStat1Value" placeholder="Stat 1 value">
        <input type="text" id="csStat2Label" placeholder="Stat 2 label">
        <input type="text" id="csStat2Value" placeholder="Stat 2 value">
        <input type="text" id="csStat3Label" placeholder="Stat 3 label">
        <input type="text" id="csStat3Value" placeholder="Stat 3 value">
      </div>

      <div class="cs-form-actions">
        <button type="button" id="csSaveBtn" class="btn btn-primary">Save</button>
        <button type="button" id="csCancelBtn" class="btn btn-outline">Cancel</button>
      </div>
    </div>

    <div id="caseStudiesList" class="cs-list">
      <p class="empty-note">Loading…</p>
    </div>
  </section>
</div>

<script src="admin.js"></script>
</body>
</html>
