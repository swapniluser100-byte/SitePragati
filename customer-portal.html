<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SitePragati — Customer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="customer.css">
</head>
<body>

<!-- Login screen -->
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <h1>SitePragati</h1>
    <p class="login-sub">Customer portal</p>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@yourbusiness.com" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="Your password" required>
    <button type="submit" class="btn btn-primary">Log in</button>
    <p class="login-error" id="loginError"></p>
    <p class="login-help">Don't have login details? Contact SitePragati to get set up.</p>
  </form>
</div>

<!-- Dashboard (hidden until authenticated) -->
<div id="dashboard" class="dashboard" hidden>
  <header class="admin-header">
    <span class="brand">SitePragati <span>Customer Portal</span></span>
    <button type="button" id="logoutBtn" class="btn btn-outline btn-small">Log out</button>
  </header>

  <p class="welcome-line" id="welcomeLine"></p>

  <div class="panel-head">
    <h2>Support tickets</h2>
    <button type="button" id="newTicketBtn" class="btn btn-primary btn-small">+ New ticket</button>
  </div>

  <div id="ticketForm" class="cs-form" hidden>
    <h3>New ticket</h3>
    <label for="ticketSubject">Subject</label>
    <input type="text" id="ticketSubject" placeholder="e.g. Update menu prices, Fix broken image" required>
    <label for="ticketDescription">Details</label>
    <textarea id="ticketDescription" rows="4" placeholder="Describe what you need — the more detail, the faster we can help."></textarea>
    <div class="cs-form-actions">
      <button type="button" id="ticketSaveBtn" class="btn btn-primary">Submit ticket</button>
      <button type="button" id="ticketCancelBtn" class="btn btn-outline">Cancel</button>
    </div>
  </div>

  <div id="ticketsList" class="ticket-list">
    <p class="empty-note">Loading…</p>
  </div>
</div>

<script src="customer.js"></script>
</body>
</html>
